services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restauhub
      POSTGRES_PASSWORD: restauhub
      POSTGRES_DB: restauhub
    ports:
      - "5432:5432"
    volumes:
      - restauhub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restauhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  restauhub-db:
