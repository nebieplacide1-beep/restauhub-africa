[project]
name = "restauhub-africa-api"
version = "0.1.0"
description = "RestauHub Africa — API backend (Module 1 : Authentification & gestion des tenants)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "cryptography>=43.0",
    "redis>=5.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un seul event loop pour toute la session de test : le moteur SQLAlchemy
# async (src/shared_kernel/db/session.py) est un singleton de module dont le
# pool de connexions asyncpg est lié à la boucle d'événements qui l'a créé —
# avec une boucle par test (comportement par défaut), les tests suivants
# échouent avec "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "DTZ"]
ignore = ["B008"]  # Depends(...) en valeur par défaut est le pattern idiomatique FastAPI

[tool.mypy]
python_version = "3.13"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
